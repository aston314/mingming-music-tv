<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>明明音乐 · 手机输入</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f1b14;color:#eef5ec;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:32px 20px}main{max-width:440px;margin:auto}.brand{color:#c7f38d;letter-spacing:2px;font-size:16px}h1{font-size:30px;margin:26px 0 12px}.intro{color:#98ad9d;line-height:1.7}.pair{padding:15px 18px;background:#203127;border:1px solid #334b39;border-radius:16px;margin:24px 0;display:flex;justify-content:space-between;align-items:center}.pair b{font-size:22px;letter-spacing:3px}.pair span{color:#afc3b1;font-size:14px}label{display:block;margin:20px 0 9px;color:#c5d5c7}input{width:100%;height:54px;background:#17261d;border:1px solid #49614e;border-radius:12px;color:#fff;padding:0 16px;font-size:18px}input:focus{outline:2px solid #c7f38d;outline-offset:2px}button{width:100%;border:0;border-radius:14px;padding:16px;background:#c7f38d;color:#18271c;font-size:18px;font-weight:600;margin-top:24px}button:disabled{opacity:.55}#message{line-height:1.7;margin-top:22px;color:#c7f38d;white-space:pre-wrap}#captcha-row{display:flex;align-items:center;margin:12px 0}#captcha-frame{width:180px;height:72px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#f5f5f7;overflow:hidden}#captcha{display:block;width:100%;height:100%;object-fit:contain}#captcha-status{padding:8px;color:#33483a;font-size:14px;line-height:1.5;text-align:center}#captcha-frame.is-error{background:#fff0e9}#captcha-frame.is-error #captcha-status{color:#a33c21}#captcha-refresh{width:auto;padding:14px;margin:0 0 0 16px;background:#294030;color:#c7f38d;font-size:15px;flex-shrink:0}.device{background:#253d2d;color:#eff5ed;text-align:left;font-size:16px}.device small{display:block;margin:8px 0 0;color:#acbeb0}[hidden]{display:none!important}
</style></head><body><main><div class="brand">明明音乐 · TV</div><h1 id="title">手机输入</h1><p class="intro" id="intro">手机和电视需连接同一个局域网。</p><div class="pair"><div><span>电视配对码</span><br><b id="pair-code"></b></div><span id="expiry"></span></div><form id="form"><label id="user-label" for="value">搜索关键词</label><input id="value" name="username" maxlength="128" autocomplete="off" required><div id="account-fields" hidden><label for="password">密码</label><input id="password" name="password" type="password" maxlength="256" autocomplete="current-password"></div><div id="register-fields" hidden><label for="captcha-code">验证码</label><div id="captcha-row"><div id="captcha-frame" aria-busy="true"><img id="captcha" alt="图片验证码" hidden><span id="captcha-status" role="status" aria-live="polite">正在加载验证码…</span></div><button id="captcha-refresh" type="button">换一张</button></div><input id="captcha-code" name="captcha" maxlength="32" autocomplete="off" placeholder="输入图片中的字符"></div><button id="submit" type="submit">发送到电视</button></form><div id="devices" hidden></div><div id="message" role="status" aria-live="polite"></div></main><script id="pair-config" type="application/json">__PAIR_CONFIG__</script><script src="/phone-assets/app.js"></script></body></html>
