<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>明明音乐</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="stage">
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">♪</span><span class="brand-name">明明音乐<span id="connection-dot" class="status-dot" aria-label="服务连接状态"></span></span></div>
      <div class="top-status"><span id="connection-label" class="sr-only">本机服务启动中</span></div>
    </header>
    <div class="workspace">
      <aside class="sidebar" aria-label="音乐导航">
        <button id="nav-recommend" class="nav-item focusable is-active" data-page="recommend" data-focus="nav-recommend"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h5M8 16h8"/></svg></span><span>歌单</span></button>
        <button class="nav-item focusable" data-page="search" data-focus="nav-search"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></span><span>搜索</span></button>
        <button class="nav-item focusable" data-page="playlists" data-focus="nav-playlists"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 20v-7h4v7M10 20V4h4v16M15 20v-11h4v11"/></svg></span><span>榜单</span></button>
        <button class="nav-item focusable" data-page="queue" data-focus="nav-queue"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h11M4 18h8m5-2 4 3-4 3Z"/></svg></span><span>播放列表</span><b id="queue-count">0</b></button>
        <button class="nav-item focusable" data-page="favorites" data-focus="nav-favorites"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.2 5.8a5 5 0 0 0-7.1 0L12 6.9l-1.1-1.1a5 5 0 0 0-7.1 7.1L12 21l8.2-8.1a5 5 0 0 0 0-7.1Z"/></svg></span><span>收藏</span></button>
        <button id="nav-account" class="nav-item focusable" data-page="account" data-focus="nav-account"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></span><span>我的</span></button>
        <div class="sidebar-spacer"></div>
        <button id="nav-settings" class="nav-item focusable" data-page="settings" data-focus="nav-settings"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3a3 3 0 0 0-3 3v.4a7.2 7.2 0 0 0-1.8 1L6.8 7a3 3 0 1 0-4.2 4.2l.4.4a7.2 7.2 0 0 0 0 2.8l-.4.4A3 3 0 1 0 6.8 19l.4-.4a7.2 7.2 0 0 0 1.8 1v.4a3 3 0 1 0 6 0v-.4a7.2 7.2 0 0 0 1.8-1l.4.4a3 3 0 1 0 4.2-4.2l-.4-.4a7.2 7.2 0 0 0 0-2.8l.4-.4A3 3 0 1 0 17.2 7l-.4.4a7.2 7.2 0 0 0-1.8-1V6a3 3 0 0 0-3-3Z"/><circle cx="12" cy="12" r="3"/></svg></span><span>设置</span></button>
      </aside>
      <main id="content" class="content" tabindex="-1"></main>
    </div>
    <footer class="player-bar">
      <button id="now-playing" class="now-playing focusable" title="打开全屏播放器"><img id="player-cover" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5NiIgaGVpZ2h0PSI5NiI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJnIiB4Mj0iMC41IiB5Mj0iMSI+PHN0b3Agc3RvcC1jb2xvcj0iI2Q2OWE1MCIvPjxzdG9wIG9mZnNldD0iMSIgc3RvcC1jb2xvcj0iIzY4NDAyMSIvPjwvbGluZWFyR3JhZGllbnQ+PC9kZWZzPjxjaXJjbGUgY3g9IjQ4IiBjeT0iNDgiIHI9IjQ4IiBmaWxsPSJ1cmwoI2cpIi8+PC9zdmc+" alt=""><span class="now-playing-copy"><strong id="player-title">未在播放</strong><span id="player-artist">选择一首歌曲开始播放</span></span></button>
      <button id="play-mode" class="icon-button mode-button control-pill focusable" title="播放顺序：列表循环" aria-label="播放顺序：列表循环"></button>
      <button id="queue-open" class="icon-button control-pill queue-button focusable" title="播放队列" aria-label="播放队列"></button>
      <div class="player-controls">
        <button id="prev" class="icon-button focusable" title="上一首" aria-label="上一首"></button>
        <button id="play" class="play-button focusable" title="播放" aria-label="播放"></button>
        <button id="next" class="icon-button focusable" title="下一首" aria-label="下一首"></button>
      </div>
      <div class="player-progress"><span id="player-elapsed">00:00</span><input id="seek" class="range focusable" type="range" min="0" max="100" step="0.1" value="0" aria-label="播放进度"><span id="player-duration">00:00</span></div>
    </footer>
  </div>
  <section id="player-overlay" class="player-overlay" hidden aria-label="全屏播放器">
    <div class="player-overlay-head">
      <button id="player-close" class="icon-button focusable" title="返回" aria-label="返回"></button>
      <div><strong id="overlay-track-meta" class="overlay-track-meta"></strong></div>
    </div>
    <div class="player-overlay-body">
      <div class="player-art-panel">
        <img id="overlay-cover" src="https://picsum.photos/seed/empty/600/600" alt="">
        <div class="overlay-song-heading"><strong id="overlay-title">未在播放</strong><button id="overlay-favorite" class="icon-button favorite-button focusable" type="button" aria-label="收藏歌曲" aria-pressed="false"></button><button id="overlay-artist-info" class="icon-button artist-info-button focusable" type="button" aria-label="查看歌手和专辑详情" title="查看歌手和专辑详情"></button></div>
        <div class="overlay-progress"><input id="overlay-seek" class="range focusable" type="range" min="0" max="100" step="0.1" value="0" aria-label="播放进度"><div class="overlay-timestamps"><span id="overlay-elapsed">00:00</span><span id="overlay-duration">00:00</span></div></div>
        <div class="overlay-controls">
          <button id="player-repeat" class="icon-button mode-button repeat-button focusable" type="button" aria-label="切换播放顺序"></button>
          <button id="overlay-prev" class="icon-button focusable" title="上一首" aria-label="上一首"></button>
          <button id="overlay-play" class="play-button focusable" title="播放" aria-label="播放"></button>
          <button id="overlay-next" class="icon-button focusable" title="下一首" aria-label="下一首"></button>
          <button id="overlay-queue" class="icon-button focusable" title="播放列表" aria-label="播放列表"></button>
        </div>
      </div>
      <div class="player-detail-panel">
        <section class="overlay-section lyric-section">
          <div class="overlay-section-head"><h2 class="lyric-badge overlay-title-badge"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span>歌词</span></h2><span id="lyric-status" hidden>等待播放</span></div>
          <div id="overlay-lyrics" class="overlay-lyrics" tabindex="-1" aria-label="同步歌词"><div class="state">选择一首歌曲开始播放</div></div>
        </section>
        <section id="player-comment-section" class="overlay-section comment-section">
          <div class="overlay-section-head"><h2 class="comment-badge overlay-title-badge"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H3l2-5a8.5 8.5 0 1 1 16-3.5Z"/></svg><span>评论</span><span id="comment-count">0</span></h2></div>
          <div id="overlay-comments" class="overlay-comments focusable" tabindex="0" aria-label="评论"><div class="state">选择一首歌曲查看评论</div></div>
        </section>
        <button id="player-comments-toggle" class="icon-button comments-toggle focusable" type="button" aria-label="隐藏评论" aria-controls="player-comment-section" aria-expanded="true"></button>
      </div>
    </div>
  </section>
  <section id="queue-popup" class="queue-popup" hidden aria-label="播放列表"></section>
  <div id="modal-root" class="modal-root" hidden></div>
  <audio id="audio" preload="metadata"></audio>
  </div>
  <script src="/app.js"></script>
</body>
</html>
